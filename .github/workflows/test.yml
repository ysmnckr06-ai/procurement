name: Testler

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Uçtan uca testin çalışacağı adres"
        required: false
        default: "https://procurement-dun.vercel.app"

jobs:
  backend:
    name: Sunucu testleri
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test.test.test
      SUPABASE_ANON_KEY: test.test.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  frontend:
    name: Arayüz derlemesi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: procurement-platform
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test
      NEXT_PUBLIC_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: procurement-platform/package-lock.json
      - run: npm ci
      - run: npm run build
